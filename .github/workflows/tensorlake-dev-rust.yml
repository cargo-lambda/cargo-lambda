name: Tensorlake builds

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tensorlake-builds
  cancel-in-progress: false

jobs:
  build:
    runs-on: tensorlake-medium
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Set up Rust cache
        uses: tensorlakeai/tensorlake-github-runners/actions/setup-rust-cache@c095878eb76e4786906ea7abdad93d20287b0536
        with:
          cache-namespace: builds
          cache-target: "true"
          cache-sccache: "false"
          prefetch: "true"

      - name: Build Rust workspace
        run: cargo build --workspace --locked
