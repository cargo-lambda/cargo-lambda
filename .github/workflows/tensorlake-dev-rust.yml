name: Tensorlake builds

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tensorlake-builds
  cancel-in-progress: false

jobs:
  build:
    runs-on: tensorlake-medium
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Before the toolchain, so a restored rustup toolchain is reused.
      - name: Restore Rust cache
        uses: tensorlakeai/github-runners@9adec6a59d25f7fe100eded52d2c3cb75bb5c582
        
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Build Rust workspace
        run: cargo build --workspace --locked
